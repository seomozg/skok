<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Skok: проба поворота на живой камере</title>
  </head>
  <body>
    <script type="module">
      import { FilesetResolver, PoseLandmarker } from '/vision_bundle.mjs';
      import { compose, drawVideo, summarize } from '/probe-lib.js';

      async function main() {
        const result = { steps: [], images: [] };
        const record = (name, data) => {
          result.steps.push({ name, ...data });
        };

        // Живой кадр с настоящей камеры.
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        const video = document.createElement('video');
        video.srcObject = stream;
        video.muted = true;
        video.playsInline = true;
        await video.play();
        await new Promise((resolve) => {
          const check = () => {
            if (video.videoWidth > 0 && video.readyState >= 2) {
              resolve();
            } else {
              requestAnimationFrame(check);
            }
          };
          check();
        });

        const vision = await FilesetResolver.forVisionTasks('/wasm');
        const landmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: '/models/pose_landmarker_lite.task',
            delegate: 'GPU',
          },
          runningMode: 'VIDEO',
          numPoses: 1,
        });

        let timestamp = 0;
        const detect = (source) => {
          timestamp += 1;
          const output = landmarker.detectForVideo(source, timestamp);
          const landmarks = output.landmarks?.[0] ?? [];
          return { summary: summarize(landmarks), landmarks };
        };

        /**
         * Детектирует на кадре, повёрнутом на заданный угол.
         *
         * Человек в кадре двигается, поэтому берём несколько свежих кадров
         * подряд: первый же, где человека видно, считаем удачным.
         */
        const detectStable = (angle) => {
          for (let attempt = 0; attempt < 12; attempt += 1) {
            const canvas = drawVideo(video, angle);
            const result = detect(canvas);
            if (result.summary.count > 0) {
              return { ...result, canvas, attempts: attempt + 1 };
            }
          }
          return {
            summary: { count: 0 },
            landmarks: [],
            canvas: drawVideo(video, angle),
            attempts: 12,
          };
        };

        record('camera', {
          width: video.videoWidth,
          height: video.videoHeight,
          rotationField: stream.getVideoTracks()[0]?.getSettings()?.rotation ?? null,
        });

        // Все четыре угла: ищем тот, при котором человек вертикален.
        for (const angle of [0, 90, 180, 270]) {
          const rotated = detectStable(angle);
          record(`angle_${angle}`, { ...rotated.summary, attempts: rotated.attempts });
          result.images.push({
            name: `camera_angle_${angle}`,
            data: compose(drawVideo(video, angle), rotated.landmarks),
          });
        }

        landmarker.close();
        result.ok = true;
        window.__probeResult = result;
      }

      main().catch((error) => {
        window.__probeResult = { ok: false, error: String(error), steps: [], images: [] };
      });
    </script>
  </body>
</html>
