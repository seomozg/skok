<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Skob: калибровка угла в IMAGE-режиме</title>
  </head>
  <body>
    <script type="module">
      import { FilesetResolver, PoseLandmarker } from '/vision_bundle.mjs';
      import { compose, drawRotated, summarize } from '/probe-lib.js';

      /**
       * Калибровка угла поворота ОДНИМ детектором в IMAGE-режиме.
       *
       * IMAGE-режим не ведёт трекинг между вызовами, поэтому результат
       * не зависит от порядка проверки углов. Это то, что нужно для
       * перебора 0/90/180/270 при старте.
       *
       * Дополнительно меряем стоимость пересоздания детектора (reset):
       * от неё зависит, можно ли пересоздавать трекер на каждый угол.
       */
      async function main() {
        const result = { steps: [], images: [] };

        const vision = await FilesetResolver.forVisionTasks('/wasm');

        // Стоимость пересоздания детектора: от неё зависит, можно ли
        // пересоздавать трекер на каждый угол при калибровке.
        const recreateStarted = performance.now();
        const warmup = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: '/models/pose_landmarker_lite.task',
            delegate: 'GPU',
          },
          runningMode: 'VIDEO',
          numPoses: 1,
        });
        warmup.close();
        result.steps.push({
          name: 'create_cost',
          elapsedMs: Math.round(performance.now() - recreateStarted),
        });

        const landmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: '/models/pose_landmarker_lite.task',
            delegate: 'GPU',
          },
          runningMode: 'IMAGE',
          numPoses: 1,
        });

        const image = new Image();
        image.src = '/fixtures/person.jpg';
        await image.decode();

        for (const angle of [0, 90, 180, 270]) {
          const canvas = drawRotated(image, angle);
          const output = landmarker.detect(canvas);
          const landmarks = output.landmarks?.[0] ?? [];
          result.steps.push({ name: `image_${angle}`, ...summarize(landmarks) });
          result.images.push({
            name: `image_angle_${angle}`,
            data: compose(drawRotated(image, angle), landmarks),
          });
        }

        landmarker.close();
        result.ok = true;
        window.__probeResult = result;
      }

      main().catch((error) => {
        window.__probeResult = { ok: false, error: String(error), steps: [], images: [] };
      });
    </script>
  </body>
</html>
