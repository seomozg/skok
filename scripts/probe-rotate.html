<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Skok: свежий детектор на каждый угол</title>
  </head>
  <body>
    <script type="module">
      import { FilesetResolver, PoseLandmarker } from '/vision_bundle.mjs';
      import { compose, drawRotated, drawVideo, summarize } from '/probe-lib.js';

      const useCamera = new URLSearchParams(location.search).get('source') === 'camera';

      /** Загружает картинку с фикстурой. */
      async function loadImage(src) {
        const image = new Image();
        image.src = src;
        await image.decode();
        return image;
      }

      /** Открывает живую камеру и ждёт первый кадр. */
      async function openCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        const video = document.createElement('video');
        video.srcObject = stream;
        video.muted = true;
        video.playsInline = true;
        await video.play();
        await new Promise((resolve) => {
          const check = () => {
            if (video.videoWidth > 0 && video.readyState >= 2) resolve();
            else requestAnimationFrame(check);
          };
          check();
        });
        return video;
      }

      async function main() {
        const result = { steps: [], images: [] };
        const vision = await FilesetResolver.forVisionTasks('/wasm');

        const source = useCamera ? await openCamera() : await loadImage('/fixtures/person.jpg');

        /** Создаёт СВЕЖИЙ детектор — без наследуемого состояния трекинга. */
        const freshLandmarker = async () =>
          PoseLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: '/models/pose_landmarker_lite.task',
              delegate: 'GPU',
            },
            runningMode: 'VIDEO',
            numPoses: 1,
          });

        for (const angle of [0, 90, 180, 270]) {
          const canvas = useCamera ? drawVideo(source, angle) : drawRotated(source, angle);
          const landmarker = await freshLandmarker();
          const output = landmarker.detectForVideo(canvas, 1);
          const landmarks = output.landmarks?.[0] ?? [];
          landmarker.close();

          result.steps.push({ name: `fresh_${angle}`, ...summarize(landmarks) });
          result.images.push({
            name: `fresh_angle_${angle}`,
            data: compose(
              useCamera ? drawVideo(source, angle) : drawRotated(source, angle),
              landmarks,
            ),
          });
        }

        result.ok = true;
        window.__probeResult = result;
      }

      main().catch((error) => {
        window.__probeResult = { ok: false, error: String(error), steps: [], images: [] };
      });
    </script>
  </body>
</html>
